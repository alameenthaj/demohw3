<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Movie Website</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="container">

        <h1 th:text="${movieTitle}"></h1>

        <p th:text="${firstLine}"></p>

        <div th:if="${isLoggedIn}">
            <p th:text="${fullDescription}"></p>
        </div>

        <div th:unless="${isLoggedIn}">
            <p>Please log in to read the full movie description.</p>
        </div>

    </div>

</body>
</html>
